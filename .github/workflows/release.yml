name: Package and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example, 1.0.0)
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate version and package repository
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be in semantic version format, without a leading v (for example, 1.0.0)." >&2
            exit 1
          fi

          tag="v${VERSION}"
          archive="TensuraCrossUltima-${VERSION}.zip"
          git archive --format=zip --output="$RUNNER_TEMP/$archive" "$GITHUB_SHA"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
            --target "$GITHUB_SHA" \
            --title "Tensura Cross Ultima - $RELEASE_TAG" \
            --notes ""
