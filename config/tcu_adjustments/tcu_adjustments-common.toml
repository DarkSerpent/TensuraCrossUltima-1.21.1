[modules]
	#Disable baked-potato furnace and smoker recipes and allow taking finished Wok food by shift-right-clicking empty-handed.
	bakedPotatoFix = true
	#Allow multiple players to obtain the same Ultimate Skill by bypassing supported mods' global Ultimate ownership limits.
	allowSharedUltimateSkills = true
	#Log button labels, classes, bounds, and source JARs when screens open.
	debugLogScreenButtons = false
	#Remove ManasCore's inventory tab switcher and tab background from the Survival inventory.
	disableManasCoreInventoryTabSwitcher = true
	#Replace the Mojang logo on the loading screen with the Tensura Cross Ultima logo.
	replaceMojangLoadingLogo = true
	#Set the doImmediateRespawn gamerule to true whenever a server world loads.
	doImmediateRespawn = true
	#Disable Tensura Guild's Free Guild prefix in player names and tab-list names.
	disableTensuraGuildPrefix = true
	#Apply spawn-radius behavior for Tensura race home dimensions and use race home spawns for Recall Potions when no valid saved spawn point remains.
	spawnRadiusTensura = true
	#Set players to Survival in the Overworld, Nether, End, Elemental Realm, and Demon World, and to Adventure in the Labyrinth Tree and Exoframe boss dimensions.
	gamemodeValidation = true
	#Allow Tensura abilities to be activated and their modes cycled while in spectator mode.
	spectatorModeFix = true
	#Experimental routing for Tensura and TRNightmare custom visual-effect layers through shader-compatible built-in render types. Disabled by default.
	shaderPackVisualFix = false
	#Prevent Angel Knights from crashing while removing blocked effects during their entity tick.
	angelKnightEffectsFix = true
	#Suppress Music Triggers INFO messages for trigger-state transitions and trigger selection.
	suppressMusicTriggerLogs = true
	#Bind Unique and Ultimate Skill Study Books to their owner, prevent dropping or transfer, and preserve them through death.
	uniqueSkillBookProtection = true
	#Enable welcome_message.txt delivery on join and after the player's first pending Unique Skill choice. Players can opt out with /tcu welcome off.
	welcomeMessage = true
	#Make tagged bosses detect invisible players, and let non-boss mobs target player attackers after three hits and maintain that target within 10 blocks; includes player-attributed skill and projectile damage.
	nerfInvis = true
	#Stop Music Triggers for a player during a tagged boss fight when another mod starts a music or record sound; allow the boss victory track to play.
	suppressMusicTriggersDuringBossMusic = true
	#Show Lootr's dangerous-break warning once per player every 10 minutes across all Lootr blocks and entities.
	lootrWarningCooldown = true

	[modules.tcuChatEnhancements]
		#Add chat channel tabs that filter the local chat display without changing server chat delivery.
		channelsEnabled = true
		#Add a TCU tab containing messages from The Voice of the World.
		voiceOfWorldChannelEnabled = true
		#Prefix player chat, whispers, and stickers with the receiving client's local 12-hour time.
		playerMessageTimestamps = true
		#Allow players to use limited Markdown and legacy ampersand formatting codes in chat.
		limitedChatFormatting = true

	[modules.ChunkyAutomation]
		#Automatically continue saved Chunky generation on dedicated servers, pause it while players are online, and start a square task when no saved task exists.
		chunkyAutoGeneration = true
		#Chunky radius, in blocks, for the square pre-generation task started when no saved task exists.
		# Default: 5000
		# Range: 1 ~ 100000
		generationRadius = 15000

	[modules.randomGateways]
		#Enable randomly spawned Gateways in the Overworld.
		enabled = true
		#Number of in-game days between scheduled Gateway spawns, before the random time-of-day offset.
		# Default: 5
		# Range: 1 ~ 3650
		daysBetweenGateways = 5
		#Give one 30% chance per in-game day for an extra Gateway during each cooldown period.
		chaosFactor = true

	[modules.tcuPrestigeChanges]
		#Limit learned Ultimate Skills by the configured number of slots for each Soul Grade; blocked skill-book uses are not consumed and blocked FTB Quest command rewards remain unclaimed.
		ultimatesRequirePrestige = true
		#Let players defer eligible Ultimate Skill grants while they have a free Soul Grade slot; pending evolutions require enough maximum Magicules for their acquisition cost before they can be manifested.
		deferUltimateSkillChoices = true
		#Require Medium Grade before obtaining these Ultimate Skills:
		#trevolved:dragon_god_orsted
		#tensuramoreskills:witch_of_envy_satella
		#trnightmare:akashic_records
		#trnightmare:astral_light
		#trnightmare:mammon
		#trnightmare:pride_manas
		#trnightmare:raziel
		#trnightmare:synthetic_mammon
		#trnightmare:yog_sothoth
		#trnightmare:yog-sotohort
		#foxablazeultimate:raphael
		#foxablazeultimate:ciel
		#foxablazeultimate:shub_niggurath
		restrictUniqueCopyingUltimates = true
		#Ultimate Skill slots at No Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 0
		# Range: -1 ~ 1000
		noGradeUltimateSlots = 0
		#Ultimate Skill slots at Low Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 1
		# Range: -1 ~ 1000
		lowGradeUltimateSlots = 1
		#Ultimate Skill slots at Medium Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 2
		# Range: -1 ~ 1000
		mediumGradeUltimateSlots = 2
		#Ultimate Skill slots at High Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 3
		# Range: -1 ~ 1000
		highGradeUltimateSlots = 3
		#Ultimate Skill slots at Greater Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 4
		# Range: -1 ~ 1000
		greaterGradeUltimateSlots = 4
		#Ultimate Skill slots at Grand Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: 5
		# Range: -1 ~ 1000
		grandGradeUltimateSlots = 5
		#Ultimate Skill slots at Supreme Grade. Set to -1 for unlimited slots at this and all higher grades.
		# Default: -1
		# Range: -1 ~ 1000
		supremeGradeUltimateSlots = -1
		#Use the configured number of skill lock slots for each Soul Grade.
		progressiveSoulLocks = true
		#Skill lock slots for No Grade.
		# Default: 2
		# Range: 0 ~ 1000
		noGradeSkillLocks = 2
		#Skill lock slots for Low Grade.
		# Default: 3
		# Range: 0 ~ 1000
		lowGradeSkillLocks = 3
		#Skill lock slots for Medium Grade.
		# Default: 5
		# Range: 0 ~ 1000
		mediumGradeSkillLocks = 5
		#Skill lock slots for High Grade.
		# Default: 6
		# Range: 0 ~ 1000
		highGradeSkillLocks = 7
		#Skill lock slots for Greater Grade.
		# Default: 7
		# Range: 0 ~ 1000
		greaterGradeSkillLocks = 9
		#Skill lock slots for Grand Grade.
		# Default: 9
		# Range: 0 ~ 1000
		grandGradeSkillLocks = 11
		#Skill lock slots for Supreme Grade.
		# Default: 10
		# Range: 0 ~ 1000
		supremeGradeSkillLocks = 15
		#Grant a random unique skill study book bonus for every 3 unblacklisted Unique Skills that are lost when a player prestiges due to not locking them.
		unlockedUniqueBonus = true
		#Grant one Tensura Battlewill Manual for every 2 Battlewills lost when a player prestiges due to not locking them.
		unlockedBattlewillBonus = true

	[modules.tensuraMysticism]
		#Allow players with Mysticism's Restricted skill to learn Unique Skills through TCU's Great Sage choice and Unique or Ultimate Skill Study Books.
		restrictedUniqueChoiceStudyBooksFix = true
		#Allow players with Mysticism's Restricted skill to receive Heavenly Eye from Martial Master, including repairing a missing grant on login; Creator-created Martial Master does not grant Heavenly Eye.
		restrictedMartialMasterEnhancements = true

	[modules.reawakeningUniqueSkillBook]
		#Offer a selectable Unique Skill Study Book after reincarnations at prestige counts 2, 4, 6, 8, and 10; closing the selection grants a random unblacklisted Unique Skill Study Book.
		enabled = true

	[modules.spiritContractPity]
		#Base duplicate prevention and failure-tier progression on the player's currently contracted spirit levels; replace duplicates with an unowned spirit unless the configured failure chance occurs.
		enabled = true
		#Chance for a spirit prayer to fail before all Lesser Spirits have been collected.
		# Default: 10
		# Range: 0 ~ 100
		baseFailureChancePercent = 10
		#Chance for a spirit prayer to fail after all Lesser Spirits have been collected, until all Medium Spirits are collected.
		# Default: 20
		# Range: 0 ~ 100
		allLesserFailureChancePercent = 20
		#Chance for a spirit prayer to fail after all Medium Spirits have been collected, until all Greater Spirits are collected.
		# Default: 40
		# Range: 0 ~ 100
		allMediumFailureChancePercent = 40
		#Chance for a spirit prayer to fail after all Greater Spirits have been collected.
		# Default: 60
		# Range: 0 ~ 100
		allGreaterFailureChancePercent = 60

	[modules.raceBalanceChanges]
		#Let players whose Tensura race home is the Elemental Realm pass through Labyrinth Barriers without defeating the Colossus.
		elementalHouseKeys = true
		#Give Elemental Realm race players the Ring of the Elves in their Ender Chest the first time they travel directly from the Elemental Realm to the Labyrinth.
		elementalRealmRingGift = true
		#Set a player's alignment to Holy when they evolve into the base Elemental Lord race.
		evolutionElementalLordHoly = true
		#Let races whose home dimension is mysticism:elemental_realm obtain a Hero Egg by praying at the Labyrinth altar with Holy alignment, at least 600,000 maximum EP, and a recorded naming of Ifrit, Undine, Akash, War Gnome, and Sylphide.
		spiritualRaceHeroEggPath = true
		#Replace two Curios ring slots with two additional feet slots for Direwolf-line and Baby Spirit Fox-line races.
		doggoFeetSlots = true
		#Scale the foundational size of the TNO Slime player model independently of the Size Control skill.
		# Default: 3.0
		# Range: 0.1 ~ 10.0
		slimeModelBaseScale = 2.9

	[modules.tcuAdditionalSkills]
		#Add the Contract Intrinsic Skill for the Lesser Elemental evolution line.
		mysticismContractSkill = true
		#Add BTRUltima's Size Control Extra Skill, granted to Metal Slimes or after mastering Spatial Manipulation and Magic Space Transform.
		btrultimaSizeControlSkill = true
		#Enable Physical Manifestation, granted on evolution into Mysticism's Elemental Lord or Majin Lord and TR Nightmare's Manas. If acquired earlier, it can be used throughout TR Nightmare's Body Double/Parallel Existence/Einherjar/Manas line.
		physicalManifestationSkill = true

	[modules.skillBalanceChanges]
		#Limit Fungus Infection Amp per effect, select Analyze effects in a GUI, spend current Magicules with a 300-second Analyze cooldown (150 seconds when mastered), and charge 1,500 Magicules for the first stack with each next stack costing 25% more.
		fungusInfectionNerf = true
		#Show Enchantment Descriptions mod text in the Godly Craftsman enchantment tab, with the magnifier tooltip icon.
		godlyCraftsmanEnhancements = true
		#Fix Domain of Negation's caster Anti-Skill effect and improve its mastered effects, passive damage, and Divine Cancellation cooldown.
		domainNegationBuffs = true
		#Grant Thought Acceleration when Boogie Woogie is learned, grant Sage when mastered, and set its active Resistance and Strength buffs to II and III.
		boogieWoogieFixes = true
		#Let Great Sage scanners see entities they lock and scan through any invisibility effect; visibility changes only for the scanner.
		greatSageScanRevealsInvisibleTargets = true
		#Add Hero's Circumstance to Chosen One, allowing the user to change their current alignment to Holy after confirmation.
		chosenOneHeroCircumstance = true
		#Fix provider-based skill and item interactions in TRNightmare.
		providerFixes = true
		#Require mastery of Steel Strength and at least 200,000 EP to learn Demonic Power; prevent its alignment change, double its Magicule cost, make it a recastable timed ability (5 minutes unmastered, 10 minutes mastered), and announce activation and deactivation.
		demonicPowerAdjustments = true
		#Set Pressure Training's learning cost to 100,000 Aura per use and its active cost to 10,000 Aura per second (5,000 when mastered), increase the training needed for mastery tenfold, and apply its configured self-damage directly to health while granting a learn point to the selected Resistance skill.
		pressureTrainingFix = true
		#Fix Divine Wisdom Core and Conceptual Existence Unity return-body tracking, replace Conceptual Existence with Divine Wisdom Core on Manas evolution and repair existing Manas players on login, keep Ego Boost mode available, sever connected Divine Wisdom Core sessions without retaining the prior host, and show remaining Unity hijack time.
		divineWisdomCoreFixes = true
		#Require Unity players to be subordinate to one another, prevent lending Ultimate Skills, and limit Divine Wisdom Core loans to one skill plus one additional skill per target Prestige; new loans replace the oldest when the target is at the limit.
		divineWisdomCoreNerf = true
		#Make the skill-mastery minigame harder, keep separate positive/red orb caps with occasional shifts, spawn red orbs about 15% slower than positive orbs with natural overlap, and give new red orbs a short growth and click-grace period.
		trnightmaresMasteryMinigameDifficulty = true
		#Apply a 1,200-second cooldown after Food Chain successfully transfers a skill.
		foodChainNerf = true
		#Remove duplicate Ritual Scythes from player inventories while preserving one copy.
		spiritualistFixes = true
		#Validate Deal Maker/Pazuzu contracts before acceptance, restrict attribute deals to the fixed player-stat dropdown, apply attribute effects only to accepted contracts, keep each attribute share stable across player lifecycle changes, preserve unrelated and one-time modifiers, transfer maximum Magicules/Aura exactly within current limits, prevent duplicate acceptance, and make transferred Unique Skills free of Mysticism Soul Energy costs.
		dealMakerFixes = true

	[modules.realisticEPRegen]
		#Regenerate Aura over time and while sleeping, replacing Tensura's passive Aura regeneration.
		aura = true
		#Regenerate Magicules over time and while sleeping, replacing Tensura's and EPFix's passive Magicule regeneration.
		magicules = true

	[modules.slimeThroneRepeatableSkillQuests]
		#Remove the TR Beyond (Beyond Adventures) repeatable skill quests for Shogo, Shinji, Shin, Mark, Mai, Kyoya, Kirara, Folgen, Rimuru, Orc Disaster, Luminous, Hinata, and Carrion, including their rewards.
		enabled = true

	[modules.questRerolling]
		#Cooldown in hours between player-initiated rerolls of a single Daily quest.
		# Default: 24
		# Range: 0 ~ 87600
		dailyCooldownHours = 24
		#Cooldown in hours between player-initiated rerolls of their Weekly quests.
		# Default: 168
		# Range: 0 ~ 87600
		weeklyCooldownHours = 168
		#Cooldown in hours between player-initiated rerolls of their Required (Prestige) quests.
		# Default: 72
		# Range: 0 ~ 87600
		prestigeCooldownHours = 72

	[modules.characterResetScrollPrestigeRequirement]
		#Require TR Beyond prestige eligibility before a Character Reset Scroll can be completed, and report unmet requirements in chat.
		enabled = true

	[modules.tensuraTamedReturn]
		#Return the player's owned tamed and Tensura-named mobs to them when they join, unless those mobs are stored in a skill.
		enabled = false

	[modules.createFixes]
		#Skip Create's unbound crushed osmium holder in creative tabs and Chromatic Compound color registration.
		createCrashFixes = true
		#Whitelist Create Aeronautics and Offroad simulated contraption blocks in Chloride to prevent their wheels, propellers, bearings, and other rendered parts from being distance-culled.
		aeronauticsSimulatedContraptionCullingFix = true

