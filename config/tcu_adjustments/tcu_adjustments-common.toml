	[modules.individualQuestProgress]
		#Keep FTB Quests progress individual instead of sharing it with FTB Teams members.
		enabled = true

	[modules.resistanceTraining]
		#Award resistance training points using incoming damage before armor and other damage reduction.
		enabled = true

	[modules.epEvolution]
		#Enable TCU's EP tracking and gear evolution data.
		enabled = true

	[modules.greatSageIntro]
		#Offer three weighted subtype choices for Lesser Elemental and Insect during Great Sage's intro.
		rollThreePickOne = true
		#Choose a random race if the Great Sage race selector is dismissed without submitting.
		randomRaceOnSelectionClose = true

	[modules.tensuraLuckyBlocks]
		#Enable TCU's Lucky Blocks, called the Awakening Flame Block.
		enabled = true

	[modules.playerAnimations]
		#Enable TCU's player movement, pose, cape, and elytra animations (requires Player Animation Library).
		enabled = false

	[modules.guardVillagersTensura]
		#Enable Tensura Guard Villager upgrades, a fixed 5% movement-speed increase, village return and replenishment, and anti-regeneration wounds.
		enabled = true
		#Fraction of normal healing received by hostile mobs recently wounded by a Guard Villager.
		# Default: 0.3
		# Range: 0.0 ~ 1.0
		woundHealingMultiplier = 0.3
		#Duration in ticks of the anti-regeneration wound applied by Guard Villager attacks.
		# Default: 100
		# Range: 1 ~ 1200
		woundDurationTicks = 100

	[modules.pillagersTensura]
		#Enable Tensura skills, EP targets 10% below Guard Villagers, Elite variants, and movement speed fixed to 5% above vanilla for Pillager-type enemies.
		enabled = true

	[modules.additionalMobSkills]
		#Add suggested Tensura skills to selected vanilla mobs and provide additional compatibility for Friends & Foes, Mowzie's Mobs, and Bosses' Rise.
		enabled = true

	[modules.ironGolemPhysicalAttackResistance]
		#Give Iron Golems the Tensura Physical Attack Resistance skill and keep movement speed 5% above vanilla.
		enabled = true

	[modules.apotheosisTensura]
		#Enable TCU's Apotheosis compatibility, remove the Eterna cap penalty, increase shelf Eterna and Max Eterna by 30%, and scale enchanting Eterna to 0.6 levels per point.
		enabled = true
		#Double Apotheosis boss and miniboss health and reduce damage they take from all sources, including Tensura skills, by 50%.
		tankyApothicMobs = true
		#Prevent Tensura's Possession skill from possessing Apotheosis bosses and minibosses.
		apothicAura = true

	[modules.iceAndFireTensura]
		#Make Ice and Fire elemental dragons neutral to players below the configured EP threshold.
		enabled = true
		#Players at or above this EP remain hostile targets for Ice and Fire elemental dragons.
		# Default: 60000
		# Range: > 0
		epThreshold = 60000

	[modules.emeraldToSilverCoinTrades]
		#Replace emeralds used or given in vanilla Villager, Tensura Dwarf, and Lizardman trades with Silver Coins.
		enabled = true

	[modules.essentialSyncDiagnostics]
		#Log EssentialPatcher cosmetics-sync status and compare session fingerprints reported by connected clients. Fingerprints are hashes, not session keys.
		enabled = true

	[modules.magiculePoisonWarning]
		#Warn players only after they are exposed to magicule poisoning and take magicule poison damage.
		enabled = true

	[modules.deathCatchUpProtection]
		#Grant temporary keep-inventory protection after repeated deaths to players who have never prestiged.
		enabled = true

	[modules.epFoodRewards]
		#Enable one-time EP rewards for eating foods from An Appetite Which Surpasses Ultima.
		enabled = true
		#Reset food EP reward tracking after prestige so previously rewarded foods can grant EP again.
		resetOnPrestige = true

	[modules.isekaiEvolved]
		#Enable TCU's compatibility adjustments for Tensura: Isekai Evolved Addon.
		enabled = true
		#Blacklist the four Konosuba Unique Skills and four Konosuba Ultimate Skills.
		disableKonosubaSkills = true
		#Prevent Lesser Demon-Dragon and every race in its evolution chain from being selected or evolved into.
		disableDemonDragonHybrid = true
		#Remove character aliases from Isekai Evolved Ultimate God skill names.
		simplifyUltimateGodNames = true
		#Add Isekai Evolved's enabled Unique Skills to TCU's Great Sage rollThreePickOne pool.
		addUniqueSkillsToGreatSage = true
		#Isekai Evolved Unique Skills to include in Great Sage's three-choice pool.
		greatSageUniqueSkills = ["trevolved:quagmire", "trevolved:dragon_king", "trevolved:manipulator", "trevolved:originator", "trevolved:demonic_soul", "trevolved:trickster", "trevolved:fencer", "trevolved:undead", "trevolved:golden_shell", "trevolved:water_saint"]
		#Rename Isekai Evolved's Flight Magic to Parabolic Flight.
		renameFlightSkill = true

	[modules.tensuraNightmares]
		#Enable TCU's compatibility adjustments for Tensura Reincarnated Nightmares.
		enabled = true
		#Make Tensura Possession work for Body Double, Parallel Existence, Einherjar, and Manas by preserving a return body and preventing Divine Wisdom Core from forcing spiritual form during an active possession.
		manasPossessionFix = true
