		#Disable these duplicate Tensura Nightmares skills: Raphael Knowledge (trnightmare:raphael_knowledge), Raphael Wisdom (trnightmare:raphael_wisdom), Beelzebuth (trnightmare:beelzebuth), Veldora Lord of Storms (trnightmare:veldora_lord_of_storms), Samael (trnightmare:samael), and Witch's Envy (trnightmare:witches_envy). Applies to learning, grants, and prerequisite-based unlocks.
		disableDuplicateUltimateSkills = true
		#Enable rare natural spawning for Truth (Galand), Pacifism (Grayroad), Purity (Derieri), Patience (Drole), and Selflessness (Fraudrin), without changing their biome rules.
		rareTenCommandmentBossSpawns = true
		#Spawn chance denominator for the listed Ten Commandment bosses in every dimension where they naturally spawn, including minecraft:nether and mysticism:hell: 400 means a 1-in-400 chance per natural spawn attempt. Smaller values make them more common.
		# Default: 400
		# Range: 1 ~ 1000000
		tenCommandmentBossSpawnRarity = 300
		#Remove the Great Sage ego from Tensura Nightmares' Ego Management menu and existing player ego data on join, without removing the normal Great Sage skill.
		disableGreatSageEgo = true
		#Disable Tensura Nightmares' trnightmare:day_night_inversion skill and remove it from players when they join.
		disableDayNightInversion = true
		#Disable Tensura Nightmares' Spellcraft skill, its unlock messages, custom spell access, and existing learned skills.
		disableSpellcraft = true
		#Disable Tensura Nightmares Soul Types and Soul Traits, clear existing soul data and soul bonuses on join while preserving Spiritual Magic supported by a matching spirit contract, the player's matching Transform skill, or current-race intrinsic skills.
		disableSoulTypesAndTraits = true
		#Allow players with Mysticism's Restricted skill to learn Tensura Nightmares battlewills, regardless of race.
		allowRestrictedBattlewills = true
		#Allow players with Mysticism's Restricted skill to learn and receive Tensura Nightmares' trnightmare:friendship Extra Skill, paying its acquisition cost with Aura instead of Magicules.
		allowRestrictedFriendship = true
		#Scale the relative weight of Tensura Nightmares Magic Tome chest drops; 0 disables them, 5 preserves current rates, and 10 doubles their weight.
		# Default: 5
		# Range: 0 ~ 10
		magicTomeLootScale = 1
		#Scale the relative weight of Tensura Nightmares Unbound Tome chest drops; 0 disables them, 5 preserves current rates, and 10 doubles their weight.
		# Default: 5
		# Range: 0 ~ 10
		unboundTomeLootScale = 1
		#Disable Tensura Nightmares' Ultimate Skill slot limit.
		disableUltimateSlots = true
		#Prevent Tensura Nightmares from giving its guide book to players when they join.
		disableJoinGuideBook = true
		#Disable the Title Manager Extra Skill and Tensura Nightmares' title tracking, acquisition, and active title benefits.
		disableTitleManagerAndTracking = true
		#Disable Tensura Nightmares' nation commands, interactions, and menus.
		disableNationSystem = true
		#Disable the Tensura Nightmares cosmetics menu and its keybind, while leaving cosmetic actions available.
		disableCosmeticsMenu = true
		#Disable the Tensura Nightmares racial progression menu, its keybind, and progression purchases.
		disableRacialProgressionMenu = true
		#Scale Tensura Nightmares Slayer Magic tome chest drops; 0 disables them, 1 gives each tome entry a 20% roll chance with at most 1 tome per chest, 2-9 progressively increase the chance and cap, 10 preserves the default behavior, and 11-20 increase relative weight up to double.
		# Default: 1
		# Range: 0 ~ 20
		slayerTomeLootScale = 1
		#Disable the Tensura Nightmares Ultimate Evolution Menu and its keybind; automatically grant eligible Ultimate evolutions when their prerequisites are met.
		disableUltimateEvolutionMenu = true

