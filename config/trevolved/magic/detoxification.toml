#Controls for trevolved:detoxification. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[balance]
    #Advanced cost.
    # Default: 20000.0
    # Range: 0.0 ~ 1.0E12
    advancedCost = 20000.0
    #Base cost.
    # Default: 5000.0
    # Range: 0.0 ~ 1.0E12
    baseCost = 5000.0
    #Divine cost.
    # Default: 80000.0
    # Range: 0.0 ~ 1.0E12
    divineCost = 80000.0
    #EP required for Advanced Detoxification.
    # Default: 300000
    # Range: 0 ~ 9223372036854775807
    advancedEp = 300000
    #EP required for Detoxification.
    # Default: 50000
    # Range: 0 ~ 9223372036854775807
    baseEp = 50000
    #EP required for Divine Detoxification.
    # Default: 1000000
    # Range: 0 ~ 9223372036854775807
    divineEp = 1000000
    #Looked-at target range before self fallback.
    # Default: 20
    # Range: 1 ~ 256
    range = 20
    #Advanced chant.
    # Default: 80
    # Range: 1 ~ 72000
    advancedCastTicks = 80
    #Advanced mastered/annulled chant.
    # Default: 15
    # Range: 1 ~ 72000
    advancedMasteredAnnulledCastTicks = 15
    #Base chant.
    # Default: 40
    # Range: 1 ~ 72000
    baseCastTicks = 40
    #Mastered/annulled chant.
    # Default: 5
    # Range: 1 ~ 72000
    baseMasteredAnnulledCastTicks = 5
    #Divine chant.
    # Default: 160
    # Range: 1 ~ 72000
    divineCastTicks = 160
    #Divine mastered/annulled chant.
    # Default: 30
    # Range: 1 ~ 72000
    divineMasteredAnnulledCastTicks = 30

[abilities]

    [abilities.advanced_detoxification]
        #Controls for trevolved:advanced_detoxification. Detailed balance is in this same file.
        #Allow learning this ability. Existing ownership is kept.
        allowAcquisition = true
        #Allow active subskills. Inherent passives are not removed.
        allowActiveUse = true
        #Allow enabling its native passive toggle. Switching it off remains allowed.
        allowPassiveToggle = true
        #Allow this ability to change/restore blocks. Claim and spawn protection still apply.
        allowTerrainDamage = true

        [abilities.advanced_detoxification.subskills]

            #Native mode 0: default. IDs/indices are not renumbered when disabled.
            [abilities.advanced_detoxification.subskills.default]
                #Enable this mode's press/hold/release input; it remains visible when disabled.
                #Also controls Endless Current. End active effects before changing settings.
                enabled = true
                #Mode damage multiplier. Does not change ordinary melee, healing or utility.
                # Default: 1.0
                # Range: 0.0 ~ 100.0
                damageMultiplier = 1.0
                #Cooldown multiplier, after family/global scaling. 0 = no cooldown.
                # Default: 1.0
                # Range: 0.0 ~ 100.0
                cooldownMultiplier = 1.0
                #Native mode Aura cost multiplier. Custom drains use detailed balance settings.
                # Default: 1.0
                # Range: 0.0 ~ 100.0
                nativeAuraCostMultiplier = 1.0
                #Native mode Magicule cost multiplier. Upkeep, percentage drains and terrain costs use detailed balance settings.
                # Default: 1.0
                # Range: 0.0 ~ 100.0
                nativeMagiculeCostMultiplier = 1.0

    [abilities.divine_detoxification]
        #Controls for trevolved:divine_detoxification. Detailed balance is in this same file.
