#Controls for trevolved:demonic_soul. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[evolutionRequirements]

    [evolutionRequirements.demonicSoul]
        #Required Existence Points.
        # Default: 1250000
        # Range: 0 ~ 9223372036854775807
        ep = 1250000
        #Primary tracked requirement; see publication CONFIGURATION.md for its meaning.
        # Default: 1000
        # Range: > 0
        requirementA = 1000
        #Secondary tracked requirement; zero disables this numeric gate where unused.
        # Default: 0
        # Range: > 0
        requirementB = 0
        #Tertiary tracked requirement; zero disables this numeric gate where unused.
        # Default: 10
        # Range: > 0
        requirementC = 10
        #Require every prerequisite skill in this route to be mastered.
        requireMastery = true

[general]
    #Flat damage used when demonTransformMultiplicativeDamage is false. Mastery increases it by 50%.
    # Default: 300.0
    # Range: 0.0 ~ 1.0E9
    demonTransformAdditiveDamage = 300.0
    #True multiplies Demon Transform damage. False adds the configured flat damage instead.
    demonTransformMultiplicativeDamage = true

[advancedMechanics]
    #Demonic Soul Anti-Magic/Anti-Regeneration duration.
    # Default: 10
    # Range: 0 ~ 86400
    formulaSealSeconds = 10
    #Mastered Demonic Soul seal duration.
    # Default: 15
    # Range: 0 ~ 86400
    formulaSealSecondsMastered = 15
    #Demon God/Magic God seal duration.
    # Default: 25
    # Range: 0 ~ 86400
    ultimateFormulaSealSeconds = 25
    #Mastered ultimate seal duration.
    # Default: 45
    # Range: 0 ~ 86400
    ultimateFormulaSealSecondsMastered = 45

[familyMultipliers]

    [familyMultipliers.demonGod]
        #Family outgoing-damage multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        damageMultiplier = 1.0
        #Family native-cooldown multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 100.0
        cooldownMultiplier = 1.0
        #Family Aura-cost multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        auraCostMultiplier = 1.0
        #Family Magicule-cost multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        magiculeCostMultiplier = 1.0
        #Family targeting/radius multiplier.
        # Default: 1.0
        # Range: 0.1 ~ 20.0
        rangeMultiplier = 1.0

    [familyMultipliers.demonicSoul]
        #Family outgoing-damage multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        damageMultiplier = 1.0
        #Family native-cooldown multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 100.0
        cooldownMultiplier = 1.0
        #Family Aura-cost multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        auraCostMultiplier = 1.0
        #Family Magicule-cost multiplier.
        # Default: 1.0
        # Range: 0.0 ~ 1000.0
        magiculeCostMultiplier = 1.0
        #Family targeting/radius multiplier.
        # Default: 1.0
        # Range: 0.1 ~ 20.0
        rangeMultiplier = 1.0

