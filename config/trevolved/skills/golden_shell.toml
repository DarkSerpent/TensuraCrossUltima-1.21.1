#Controls for trevolved:golden_shell. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[evolutionRequirements]

    [evolutionRequirements.goldenShell]
        #Required Existence Points.
        # Default: 1250000
        # Range: 0 ~ 9223372036854775807
        ep = 1250000
        #Primary tracked requirement; see publication CONFIGURATION.md for its meaning.
        # Default: 250000
        # Range: > 0
        requirementA = 250000
        #Secondary tracked requirement; zero disables this numeric gate where unused.
        # Default: 10
        # Range: > 0
        requirementB = 10
        #Tertiary tracked requirement; zero disables this numeric gate where unused.
        # Default: 0
        # Range: > 0
        requirementC = 0
        #Require every prerequisite skill in this route to be mastered.
        requireMastery = true

[general]
    #Flat ordinary melee damage used when goldenShellMultiplicativeDamage is false.
    # Default: 75.0
    # Range: 0.0 ~ 1.0E9
    goldenShellAdditiveDamage = 75.0
    #True multiplies Golden Body melee damage. False adds the configured flat damage instead.
    goldenShellMultiplicativeDamage = true

[advancedMechanics]
    #Maximum-health fraction restored by Immortal Demon King reformation.
    # Default: 0.5
    # Range: 0.0 ~ 1.0
    fightingGodReformationHealthFraction = 0.5
    #Unmastered minimum Shockwave Slam damage.
    # Default: 500.0
    # Range: 0.0 ~ 1.0E9
    fightingGodShockwaveDamage = 500.0
    #Mastered minimum Shockwave Slam damage.
    # Default: 750.0
    # Range: 0.0 ~ 1.0E9
    fightingGodShockwaveDamageMastered = 750.0
    #Unmastered Heavy Impact damage.
