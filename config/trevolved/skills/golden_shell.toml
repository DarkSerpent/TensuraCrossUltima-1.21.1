    # Range: 0.0 ~ 1.0E9
    goldenShellHeavyImpactDamage = 200.0
    #Mastered Heavy Impact damage.
    # Default: 350.0
    # Range: 0.0 ~ 1.0E9
    goldenShellHeavyImpactDamageMastered = 350.0
    #Mastered Immortal Armour cooldown when disabled.
    # Default: 24
    # Range: 0 ~ 86400
    fightingGodArmorCooldownMasteredSeconds = 24
    #Immortal Armour cooldown when disabled.
    # Default: 30
    # Range: 0 ~ 86400
    fightingGodArmorCooldownSeconds = 30
    #Mastered Shockwave Slam cooldown.
    # Default: 28
    # Range: 0 ~ 86400
