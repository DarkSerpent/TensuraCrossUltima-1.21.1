#Controls for trevolved:fencer. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[evolutionRequirements]

    [evolutionRequirements.fencer]
        #Required Existence Points.
        # Default: 1000000
        # Range: 0 ~ 9223372036854775807
        ep = 1000000
        #Primary tracked requirement; see publication CONFIGURATION.md for its meaning.
        # Default: 1000
        # Range: > 0
        requirementA = 1000
        #Secondary tracked requirement; zero disables this numeric gate where unused.
        # Default: 10
        # Range: > 0
        requirementB = 10
        #Tertiary tracked requirement; zero disables this numeric gate where unused.
        # Default: 0
        # Range: > 0
        requirementC = 0
        #Require every prerequisite skill in this route to be mastered.
        requireMastery = true

