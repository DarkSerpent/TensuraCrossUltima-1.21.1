#Controls for trevolved:crusader. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[evolution]

    [evolution.crusader]
        #Required effective maximum EP.
        # Default: 600000
        # Range: 0 ~ 9223372036854775807
        maximumEp = 600000
        #Primary progression requirement.
        # Default: 1500
        # Range: > 0
        requirementA = 1500
        #Secondary progression requirement.
        # Default: 75
        # Range: > 0
        requirementB = 75
        #Tertiary progression requirement.
        # Default: 2
        # Range: > 0
        requirementC = 2
        #Optional fourth progression requirement.
        # Default: 0
        # Range: > 0
        requirementD = 0
        #Require the Unique skill to be mastered.
        requireMastery = true

[crusader]
    #Additive armor.
    # Default: 50.0
    # Range: 0.0 ~ 1.0E9
    armorBonus = 50.0
    #Additional maximum health multiplier granted by Fortress Goddess.
    # Default: 2.5
    # Range: 0.0 ~ 1000.0
    fortressGoddessMaximumHealthMultiplier = 2.5
    #Mastered additional maximum health multiplier.
    # Default: 3.5
