    #Mastered Trickster Battlewill multiplier.
    # Default: 2.0
    # Range: 0.0 ~ 1000.0
    tricksterBattlewillMultiplierMastered = 2.0
    #Ticks a caught projectile remains frozen.
    # Default: 6
    # Range: 0 ~ 1200
    worldLineProjectileFreezeTicks = 6
    #Returned projectile velocity multiplier.
    # Default: 2.0
    # Range: 0.0 ~ 1000.0
    worldLineReturnVelocityMultiplier = 2.0

