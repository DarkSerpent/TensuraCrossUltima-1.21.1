#Controls for trevolved:trickster. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true

[evolutionRequirements]

    [evolutionRequirements.trickster]
        #Required Existence Points.
        # Default: 800000
        # Range: 0 ~ 9223372036854775807
        ep = 800000
        #Primary tracked requirement; see publication CONFIGURATION.md for its meaning.
        # Default: 750
        # Range: > 0
        requirementA = 750
        #Secondary tracked requirement; zero disables this numeric gate where unused.
        # Default: 5
        # Range: > 0
        requirementB = 5
        #Tertiary tracked requirement; zero disables this numeric gate where unused.
        # Default: 0
        # Range: > 0
        requirementC = 0
        #Require every prerequisite skill in this route to be mastered.
        requireMastery = true

[northGodPath]
    #Maximum-health fraction below which Boundless Horizon is active.
    # Default: 0.5
    # Range: 0.0 ~ 1.0
    boundlessHorizonHealthThreshold = 0.5
    #Melee and sweep damage multiplier while active.
    # Default: 2.0
    # Range: 0.0 ~ 1000.0
    boundlessHorizonDamageMultiplier = 2.0
    #Minimum damage to enemies crossed by the dash.
    # Default: 75.0
    # Range: 0.0 ~ 1.0E9
    feintCrossingMinimumDamage = 75.0
    #Mastered crossing minimum damage.
    # Default: 125.0
    # Range: 0.0 ~ 1.0E9
    feintCrossingMinimumDamageMastered = 125.0
    #Opening-strike damage multiplier.
    # Default: 3.0
    # Range: 0.0 ~ 1000.0
    feintOpeningDamageMultiplier = 3.0
    #Minimum empowered opening-strike damage.
    # Default: 250.0
    # Range: 0.0 ~ 1.0E9
    feintOpeningMinimumDamage = 250.0
    #Mastered minimum opening-strike damage.
    # Default: 500.0
    # Range: 0.0 ~ 1.0E9
    feintOpeningMinimumDamageMastered = 500.0
    #Constant term in the gravity damage formula.
    # Default: 40.0
    # Range: 0.0 ~ 1.0E9
    gravityDominionBaseDamage = 40.0
    #Unmastered damage cap.
    # Default: 350.0
    # Range: 0.0 ~ 1.0E9
    gravityDominionDamageCap = 350.0
    #Mastered damage cap.
    # Default: 500.0
    # Range: 0.0 ~ 1.0E9
    gravityDominionDamageCapMastered = 500.0
    #Seconds between gravity damage pulses.
    # Default: 2
    # Range: 1 ~ 86400
    gravityDominionDamageIntervalSeconds = 2
    #Unmastered damage per pulse at the core.
    # Default: 80.0
    # Range: 0.0 ~ 1.0E9
    gravitySingularityCoreDamage = 80.0
    #Mastered core damage.
    # Default: 140.0
    # Range: 0.0 ~ 1.0E9
    gravitySingularityCoreDamageMastered = 140.0
    #Seconds between core damage pulses.
