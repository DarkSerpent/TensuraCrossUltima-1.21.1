#Controls for trevolved:adventurer. Detailed balance is in this same file.
#Allow learning this ability. Existing ownership is kept.
allowAcquisition = true
#Allow active subskills. Inherent passives are not removed.
allowActiveUse = true
#Allow enabling its native passive toggle. Switching it off remains allowed.
allowPassiveToggle = true
#Allow this ability to change/restore blocks. Claim and spawn protection still apply.
allowTerrainDamage = true
#Adventurer/Kazuma against MOBS: true steals/removes their skill; false copies and leaves it intact. Independent of the skillSteal gamerule.
mobSkillSteal = true
#Adventurer/Kazuma against PLAYERS: true steals/removes their skill; false copies and leaves it intact. Independent of the skillSteal gamerule.
playerSkillSteal = true
#Block Adventurer/Kazuma skill stealing AND copying from tamed/owned creatures or any custom-named mob. Players are unaffected.
protectTamedOrNamedPetsFromSkillTheft = false

#Shared skill steal/copy blacklist for Adventurer and Fortune God, Kazuma. Item Pickpocket is unchanged.
#Empty lists preserve existing behavior. These restrictions never enable otherwise ineligible skills.
[skillBlacklist]
    #Categories to forbid: COMMON, EXTRA, INTRINSIC, UNIQUE, ULTIMATE, RESISTANCE (case-insensitive).
    blockedCategories = []
    #Exact skill registry IDs to forbid, e.g. trevolved:water_saint. Works with other mods too.
    #Use namespace:id, not display names. Unknown valid IDs are harmless.
    blockedSkillIds = []

