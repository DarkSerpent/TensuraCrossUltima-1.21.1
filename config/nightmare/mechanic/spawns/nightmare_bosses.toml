[velgrynd_dragon_mode]
	#Share of her max health (0..1) at which the Velgrynd boss takes her Scorch Dragon form. Set to 0 to disable the form.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	velgryndDragonHealth = 0.5
	#Damage of each pulse of Velgrynd's scorch breath in dragon form (a pulse every 4 ticks while it burns).
	# Default: 90.0
	# Range: 0.0 ~ 100000.0
	velgryndBreathDamage = 90.0
	#Damage of Velgrynd's diving bite in dragon form.
	# Default: 260.0
	# Range: 0.0 ~ 100000.0
	velgryndBiteDamage = 260.0
	#Damage of each squeeze while Velgrynd's dragon form has a target wrapped in her coils (every half second for three seconds); the final fling deals 1.5x this.
	# Default: 70.0
	# Range: 0.0 ~ 100000.0
	velgryndCrushDamage = 70.0

