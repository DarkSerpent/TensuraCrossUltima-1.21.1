[Origin]
	#Ticks a player must spend near a calm Dragon Lord before it teaches them (20 ticks = 1 second, 36000 = 30 minutes).
	kinshipThresholdTicks = 36000
	#Whether learning a Dragon Slayer root skill also teaches that element's Roar.
	grantRoar = true
	#Whether learning a Dragon Slayer root skill also teaches that element's Appetite (Iron has none).
	grantAppetite = true
	#Whether a player may take a second, compatible Dragon Slayer element (Fire-Lightning, Iron-Shadow, White-Shadow).
	allowSecondary = true
	#Whether a Slayer Tome or Lacrima is used up when it fails (incompatible element, already known). False = no cost on failure.
	consumeOnFailure = false

[Trees]
	#Multiplier on every Dragon Slayer tree cost.
	globalCostMultiplier = 1.0
	#Cost multiplier for every node in the tree of a player's secondary element.
	secondaryCostMultiplier = 1.5
	#Whether Dragon Force is locked in the tree of a player's secondary element.
	lockSecondaryDragonForce = true
	#Whether the capstone (Secret Art / Milky Way) is locked in the tree of a player's secondary element.
	lockSecondaryCapstone = true

[Generations]
	#1st generation (kinship-taught): cost multiplier for Body branch and Dragon Force nodes.
	firstGenBodyCostMultiplier = 0.7
	#2nd generation (lacrima-implanted): whether Body branch tier-1 nodes are unlocked for free when the lacrima is implanted.
	secondGenAutoUnlockBody = true
	#2nd generation (lacrima-implanted): cost multiplier for the capstone node.
	secondGenCapstoneCostMultiplier = 1.3
	#3rd generation (both): whether the 2nd generation capstone surcharge still applies.
	thirdGenKeepsCapstoneSurcharge = true
	#3rd generation (both): extra damage on that element's Dragon Slayer spells (0.1 = +10%).
	thirdGenDamageBonus = 0.1

[DragonLord]
	#Max health of every Dragon Lord.
	maxHealth = 20000.0
	#Armor of every Dragon Lord.
	armor = 40.0
	#Body scale of every Dragon Lord (1 = the size of Veldora's dragon form).
	scale = 1.0
	#Share of max health (0..1) where the Dragon Lord's second phase begins. Damage cannot push it past this until the phase-change roar is over.
	phaseTwoHealth = 0.5
	#Second phase: multiplier on every action cooldown (lower = attacks come faster).
	phaseTwoPace = 0.6
	#Second phase: multiplier on every attack's damage.
	phaseTwoDamage = 1.25
	#Damage of each breath pulse (a pulse every 4 ticks while it blows).
	breathDamage = 110.0
	#Damage of each of the three wingbeats of the wing gust (the last deals 1.5x).
	gustDamage = 160.0
	#Damage of the flying dive when it slams into the ground.
	diveDamage = 420.0
	#Damage of each claw swipe in the three-swipe combo (the last deals 1.6x).
	clawDamage = 200.0
	#Damage of the tail sweep.
	tailDamage = 300.0
	#Damage of the second-phase Dragon Roar.
	roarDamage = 220.0
	#Extra damage per breath pulse as a share of the victim's max health (0.025 = 2.5%).
	breathHealthShare = 0.025
	#Extra damage per wingbeat as a share of the victim's max health.
	gustHealthShare = 0.04
	#Extra damage of the dive as a share of the victim's max health.
	diveHealthShare = 0.15
	#Extra damage per claw swipe as a share of the victim's max health.
	clawHealthShare = 0.05
	#Extra damage of the tail sweep as a share of the victim's max health.
	tailHealthShare = 0.08
	#Extra damage of the Dragon Roar as a share of the victim's max health.
	roarHealthShare = 0.06
	#Minutes a Dragon Lord stays hostile toward a player (or their tamed and subordinate creatures) after being hurt by them.
	hostileMinutes = 10.0
	#Blocks a Dragon Lord wanders from where it spawned while calm.
	homeRadius = 48.0
	#Radius in blocks within which players near a calm Dragon Lord build kinship.
	kinshipRadius = 32.0
	#In-game days after a Dragon Lord is slain before it can appear again. 0 = slain stays slain forever.
	respawnAfterDays = 0.0
	#Whether Dragon Lords appear naturally.
	naturalSpawns = true
	#Minutes between natural spawn checks.
	spawnCheckMinutes = 10.0
	#Chance (0..1) that a natural spawn check tries to spawn a Dragon Lord.
	spawnChance = 0.15
	#In-game days the world must have run before the first Dragon Lord can appear naturally.
	minDaysBeforeFirstSpawn = 3.0
	#Closest distance in blocks to any player that a Dragon Lord may spawn at.
	minSpawnDistance = 64.0
	#Farthest distance in blocks from the chosen player that a Dragon Lord may spawn at.
	maxSpawnDistance = 128.0
	#Whether the first appearance of each Dragon Lord is announced to the whole server.
	announceFirstSpawn = true
	#Extra drops of the Fire Dragon Lord: modid:item,min,max,chance
	fireDrops = ["tensura:charybdis_scale,3,6,1.0", "tensura:element_core_fire,1,2,1.0", "mysticism:flame_essence,3,8,0.75", "minecraft:blaze_rod,4,8,1.0"]
	#Extra drops of the Lightning Dragon Lord: modid:item,min,max,chance
	lightningDrops = ["tensura:charybdis_scale,3,6,1.0", "tensura:element_core_wind,1,2,1.0", "mysticism:lightning_essence,3,8,0.75", "minecraft:lightning_rod,1,3,1.0"]
	#Extra drops of the Shadow Dragon Lord: modid:item,min,max,chance
	shadowDrops = ["tensura:charybdis_scale,3,6,1.0", "tensura:element_core_space,1,2,1.0", "mysticism:darkness_core,1,2,0.6", "minecraft:echo_shard,2,5,1.0"]
	#Extra drops of the White Dragon Lord: modid:item,min,max,chance
	whiteDrops = ["tensura:charybdis_scale,3,6,1.0", "tensura:high_quality_magic_crystal,2,4,1.0", "tensura:elemental_essence,2,4,1.0", "minecraft:glowstone,4,8,1.0"]
	#Extra drops of the Sky Dragon Lord: modid:item,min,max,chance
	skyDrops = ["tensura:charybdis_scale,3,6,1.0", "tensura:element_core_wind,1,2,1.0", "tensura:dragon_peacock_feather,2,4,1.0", "minecraft:phantom_membrane,3,6,1.0"]
	#Extra drops of the Iron Dragon Lord: modid:item,min,max,chance
	ironDrops = ["tensura:armorsaurus_scale,4,8,1.0", "tensura:pure_magisteel_ingot,2,4,1.0", "tensura:element_core_earth,1,2,1.0", "minecraft:iron_block,2,4,1.0"]
	#Extra drops of the Poison Dragon Lord: modid:item,min,max,chance
	poisonDrops = ["tensura:serpent_scale,4,8,1.0", "tensura:spider_fang,3,6,1.0", "tensura:element_core_water,1,2,1.0", "minecraft:fermented_spider_eye,4,8,1.0"]

[MotionSickness]
	#Whether Dragon Slayers get sick while riding a vehicle or mount.
	enabled = true
	#Ticks of riding before the sickness starts (20 ticks = 1 second).
	delayTicks = 60
	#Amplifier of the Nausea while sick (0 = level I).
	amplifier = 0
	#Amplifier of the Slowness while sick (0 = level I, -1 = no Slowness).
	slownessAmplifier = 0
	#Ticks the sickness lingers after dismounting.
	lingerTicks = 40
	#Seconds of immunity a player gets from being healed by Troia. 0 = Troia gives none.
	troiaImmunitySeconds = 600

[DragonSlaying]
	#Whether knowing any Dragon Slayer root raises damage against dragons.
	enabled = true
	#Extra damage against dragons from any source (0.3 = +30%).
	damageBonus = 0.3
	#Extra damage against dragons from Secret Arts and Dragon Slaying Arts, replacing damageBonus (0.6 = +60%). Multiplies with Milky Way's own dragon multiplier.
	secretArtBonus = 0.6
	#Entities always treated as dragons: modid:entity
	extraDragons = []
	#Entities never treated as dragons even if their id contains "dragon": modid:entity
	notDragons = ["tensura:dragon_peacock"]
