[General]
	#Chance (0-1) of absorbing the soul of a boss that matches a known Take Over tier. Replaces the tier's normal chance.
	bossChance = 0.03
	#When true, kill credit (the last player who hurt the mob) also counts, not only the killing blow.
	killCreditCounts = true
	#EP a soul needs for its strength multiplier to reach 1 + strengthScale. Costs grow with log10(1 + EP / this).
	strengthReferenceEP = 1000.0
	#How strongly a soul's EP raises its activation and upkeep costs.
	strengthScale = 0.6
	#Highest cost multiplier a strong soul can reach.
	maxStrengthMultiplier = 4.0
	#Cost multiplier once the tier spell is mastered.
	masteredCostMultiplier = 0.75
	#Ticks before a form can be taken again after it ends or swaps.
	formCooldownTicks = 20
	#Seconds between uses of a form's special.
	specialCooldownSeconds = 6
	#Extra magicules drained every second while flying in a form.
	flightDrainPerSecond = 20.0
	#Ticks of fall damage immunity after a flying form ends.
	fallImmunityTicks = 60
	#Every this many seconds spent transformed grants one mastery point to the tier spell. 0 disables it.
	masteryIntervalSeconds = 30

[Stats]
	#Highest max health a form may add.
	maxHealthBonus = 120.0
	#Highest attack damage a form may add.
	attackBonus = 30.0
	#Highest armor a form may add.
	armorBonus = 16.0
	#Highest armor toughness a form may add.
	toughnessBonus = 8.0
	#Lowest movement speed change, as a fraction of base speed.
	speedBonusMin = -0.15
	#Highest movement speed change, as a fraction of base speed.
	speedBonusMax = 0.45
	#Mob movement speed treated as equal to a player's own speed.
	referenceMobSpeed = 0.25
	#Highest knockback resistance a form may add.
	knockbackBonus = 0.8

[Traits]
	#Entities that always give an Animal Soul: modid:entity
	animalEntities = []
	#Entities that always give a Beast Soul: modid:entity
	beastEntities = []
	#Entities that never give a soul: modid:entity
	excludedEntities = ["minecraft:iron_golem", "minecraft:snow_golem", "minecraft:villager", "minecraft:wandering_trader"]
	#Whether non-vanilla creatures (Tensura's magic beasts and other mods' monsters) count as beasts unless listed as animals. Vanilla animals stay Animal Souls.
	moddedCreaturesAreBeasts = true
