[General]
	#Damage multiplier for every damaging Time Magic spell once that spell is mastered.
	masteredDamageMultiplier = 1.5

[Accelerate]
	#Cast time in ticks. 0 casts instantly.
	castTicks = 0
	#Magicule cost.
	magiculeCost = 1000.0
	#Cooldown in seconds.
	cooldown = 25
	#How long the acceleration lasts, in ticks.
	durationTicks = 200
	#Movement speed bonus as a fraction of base speed. 0.4 means +40%.
	movementSpeedBonus = 0.4
	#Attack speed bonus as a fraction of base attack speed. 0.4 means +40%.
	attackSpeedBonus = 0.4
	#Extra cooldown seconds removed from the caster's spells per real second while active. 0.5 means spell cooldowns tick 50% faster.
	spellCooldownRateBonus = 0.5

[TempoField]
	#Chant time in ticks.
	castTicks = 30
	#Magicule cost.
	magiculeCost = 16000.0
	#Cooldown in seconds.
	cooldown = 30
	#How far away the field can be centred, in blocks.
	aimRange = 24.0
	#Radius of the field in blocks.
	radius = 10.0
	#How long the field lasts, in ticks.
	durationTicks = 200
	#Slowness amplifier on enemies inside. 2 means Slowness III.
	enemySlownessAmplifier = 2
	#Mining Fatigue amplifier on enemies inside. 1 means Mining Fatigue II.
	enemyMiningFatigueAmplifier = 1
	#Attack speed penalty on enemies inside, as a fraction. 0.4 means -40%.
	enemyAttackSpeedPenalty = 0.4
	#Speed multiplier for enemy projectiles while inside the field. 0.3 means they fly at 30% speed.
	projectileSpeedMultiplier = 0.3
	#Speed amplifier on allies inside. 1 means Speed II.
	allySpeedAmplifier = 1
	#Haste amplifier on allies inside. 1 means Haste II.
	allyHasteAmplifier = 1

[ChronoLock]
	#Chant time in ticks.
	castTicks = 20
	#Magicule cost.
	magiculeCost = 14000.0
	#Cooldown in seconds.
	cooldown = 20
	#How far away the target can be, in blocks.
	range = 24.0
	#How long the target is locked in time, in ticks.
	lockTicks = 50
	#How long a boss is locked in time, in ticks.
	bossLockTicks = 20
