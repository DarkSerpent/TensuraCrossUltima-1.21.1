[Rewind]
	#Cast time in ticks. 0 casts instantly.
	castTicks = 0
	#Magicule cost.
	magiculeCost = 20000.0
	#Cooldown in seconds.
	cooldown = 45
	#How far back in time the caster snaps, in ticks.
	rewindTicks = 100
