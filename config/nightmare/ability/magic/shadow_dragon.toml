	knockback = 1.0

[ShadowDragonForce]
	#Magicules spent to turn Dragon Force on.
	activationCost = 30000.0
	#Magicules drained per second while Dragon Force is on.
	magiculePerSecond = 250.0
	#Damage multiplier on Shadow Dragon Slayer spells while Dragon Force is on.
	damageMultiplier = 1.4
	#Seconds of use between two mastery points.
	masteryIntervalSeconds = 30

[SacredGrief]
	#Chant time in ticks.
	castTicks = 40
	#Magicule cost to cast.
	magiculeCost = 75000.0
	#Cooldown in seconds.
	cooldown = 60
	#The range to the looked-at target in blocks.
	range = 24.0
	#Shadow clones that rise around the target.
	clones = 4
	#The distance the clones rise from the target in blocks.
	ringRadius = 2.6
	#Ticks before the first clone strikes.
	firstStrikeTicks = 12
	#Ticks between two clone strikes.
	strikeIntervalTicks = 8
	#The damage of each clone strike.
	cloneDamage = 100.0
	#The damage of each clone strike when mastered.
	masteredCloneDamage = 150.0
	#The damage of the final strike once the clones merge back.
	finalDamage = 320.0
	#The damage of the final strike when mastered.
	masteredFinalDamage = 480.0
	#The push of the final strike. Bosses are never moved.
	finalKnockback = 1.5

[Appetite]
	#Whether a caster who knows Shadow Dragon's Appetite regenerates magicules in darkness.
	enabled = true
	#The highest combined light level that still counts as darkness.
	maxLight = 4
	#Magicules regenerated per second in darkness.
	magiculePerSecond = 300.0
