	castTicks = 10
	#Magicule cost.
	magiculeCost = 500.0
	#Health cost, paid as blood.
	healthCost = 2.0
	#Cooldown in seconds.
	cooldown = 1
	#Most charges that can be stored at once.
	maxCharges = 3
	#Seconds the stored charges last after the last one was added.
