[General]
	#If false, a blood rite fails instead of letting its health cost kill the caster.
	selfDamageCanKill = false
	#Damage multiplier for every blood rite once that rite is mastered.
	masteredDamageMultiplier = 1.25

[CrimsonThorns]
	#Cast time in ticks.
	castTicks = 10
	#Magicule cost.
	magiculeCost = 8000.0
	#Health the caster spills to cast.
	healthCost = 4.0
	#Cooldown in seconds.
	cooldown = 10
	#Range in blocks to the looked-at target.
	range = 24.0
	#Base damage of the thorns.
	damage = 72.5
	#Extra damage fraction per Bleeding level (Bleeding I = 1 level) on the target.
	bonusPerBleedLevel = 0.25
	#Minimum flat extra damage if the target is Bleeding at all; the larger of this and the per-level bonus is used.
	bleedingFlatBonus = 29.0
	#If true, the thorns consume the target's Bleeding.
	consumeBleeding = true

[BloodPuppet]
	#Chant time in ticks.
	castTicks = 30
	#Magicule cost.
	magiculeCost = 40000.0
	#Health the caster spills to cast.
	healthCost = 8.0
	#Cooldown in seconds.
	cooldown = 45
	#Range in blocks to the looked-at target.
	range = 16.0
	#Target must be Bleeding or below this fraction (0..1) of its max health.
	healthThreshold = 0.4
	#How long the puppet is controlled, in ticks.
	durationTicks = 100
	#Range in blocks the caster can point a puppeted mob at a new victim.
	commandRange = 24.0
	#Radius in blocks a puppeted mob looks for the caster's enemies when the caster is not looking at one.
	fallbackRadius = 16.0
	#Navigation speed of a puppeted mob walking to the caster's look point.
	mobWalkSpeed = 1.2
	#Blocks per tick a puppeted player is dragged in the caster's look direction.
	playerDragSpeed = 0.11
	#The puppet breaks if the caster and the puppet are farther apart than this many blocks.
	breakDistance = 40.0

