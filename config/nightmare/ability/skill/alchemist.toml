#Magicules needed to acquire Alchemist.
magiculeAcquirement = 50000.0
#Ticks the skill key must be held before the radial menu opens. A shorter press casts the armed transmutation.
radialHoldTicks = 5
#Ticks of chanting over the transmutation circle before a cast fires (before the Gate of Truth).
chantTicks = 16
#Ticks between the clap and the cast once the Gate of Truth is open.
gateCastTicks = 4
#Cooldown multiplier once the Gate of Truth is open (0.7 = 30% shorter).
gateCooldownMultiplier = 0.7
#Magicule cost multiplier once Alchemist is mastered.
masteredCostMultiplier = 0.8
#Allow real terrain reshaping. When false, constructs form from nothing at a higher Magicule cost.
terrainEnabled = true
#Magicule multiplier for constructs formed from nothing (terrain disabled or no usable ground).
fromNothingCostMultiplier = 2.5
#Block used for constructs formed from nothing.
fromNothingBlock = "minecraft:stone"
#Allow transmutation to move fluid source blocks.
touchFluidSources = false
#Allow transmutation to move blocks that hold block entities (chests, furnaces...). Strongly discouraged.
touchBlockEntities = false
#Require the mobGriefing game rule for terrain transmutation.
respectMobGriefing = false
#Extra blocks of depth pulled under a lifted column, so the hollow stays underground.
liftDepthPadding = 2
#Seconds a recently exploded or transmuted block stays in the change log for Rebuild Terrain.
changeLogSeconds = 600
#Magicules paid per missing material unit (an ingot, a block...), before the fallback rate.
