#Construct damage multiplier per point of block hardness of the source material.
hardnessDamagePerPoint = 0.25
#Lowest construct damage multiplier from material (soft blocks like dirt).
hardnessDamageMin = 0.6
#Highest construct damage multiplier from material (obsidian and harder).
hardnessDamageMax = 3.0
