	#Largest share of modification time Mastery Speed can remove.
	maxMasterySpeedReduction = 0.9
	#Shortest a modification can take, in ticks.
	minimumModifyTicks = 1200
	#Jobs that can wait in the modification queue.
	queueSize = 4
	#Most modes the custom skill may bundle.
