#Magicules spent to obtain Vanity.
epAcquirement = 250000.0
#Bind the Ego of Vanity to the skill the moment it is learned.
grantEgo = true
#Grant Law Manipulation while Vanity or Vainglory is held (kept if the user already had it).
grantLawManipulation = true
#Grant Law Domination while Vainglory is held (kept if the user already had it).
grantLawDomination = true
#Each recent hit from the same source submode multiplies the Data gained by this factor (anti-farming).
diminishFactor = 0.6
#Seconds before a source submode's recent-hit counter resets.
diminishWindowSeconds = 60
#Random spread applied to each component's Data gain (0.4 = 60% to 140%).
componentSpread = 0.4
#Hits that deal less than this much damage give no Data.
minimumDamage = 0.5
#Most source submodes remembered at once; the least analyzed are forgotten first.
maxSources = 120
#Data past 100% on a component spills into Surplus Data, up to this cap.
surplusCap = 2000.0
#Surplus Data the Ego takes to save a Vanity template.
templateSaveCost = 100.0
#Maximum effect multiplier bonus at 100 instability (0.75 = up to x1.75).
instabilityPowerBonus = 0.75
#Chance to misfire (fizzle, cost spent) at 100 instability.
misfireMax = 0.4
#Chance to backfire at 100 instability.
backfireMax = 0.2
#Backfire self damage as a share of max health.
backfireHealthRatio = 0.08
#Backfire Weakness and Slowness duration in seconds.
backfireDebuffSeconds = 5
#Multiplier on the Spellcraft magicule cost of creations.
castCostMultiplier = 1.0
#Multiplier on the Spellcraft cooldown of creations.
castCooldownMultiplier = 1.0
#Aura spent per magicule of cost by creations on the Aura cost profile.
auraCostRatio = 1.0
#Share of max health a Blood cost creation spends per cast.
bloodHealthCost = 0.08
#Power multiplier on Blood cost creations.
bloodPowerBonus = 1.3
#Health a Blood cost cast must leave behind; casts that would drop below this are refused.
bloodReserveHealth = 4.0
#Instability added by the Chaos element.
chaosInstability = 20
#Chaos rolls from the elements the user has unlocked; when off, or when none are unlocked, it rolls from the seven base elements.
chaosFromUnlocked = true
#Distinct components fully unlocked (100% Data) needed before Data Mining works.
miningComponentThreshold = 10
#Magicules spent to inject the Ego.
miningMagiculeCost = 2000.0
#Seconds an Ego injection lasts.
miningDurationSeconds = 20
#Data Mining cooldown in seconds after an injection ends normally.
miningCooldownSeconds = 60
#Data Mining cooldown in seconds after the Ego is pushed back.
pushbackCooldownSeconds = 600
#Spiritual damage the user takes when the Ego is pushed back.
pushbackSpiritualDamage = 20.0
#Skills that push the Ego back on contact (Anti-Skill and the like).
pushbackSkills = ["tensura:anti_skill"]
#Effects that push the Ego back on contact.
pushbackEffects = ["tensura:anti_skill"]
#Damage type id = element id. Used when a hit carries no Tensura element.
damageTypeElements = ["minecraft:in_fire=flame", "minecraft:on_fire=flame", "minecraft:lava=heat", "minecraft:hot_floor=heat", "minecraft:lightning_bolt=lightning", "minecraft:freeze=ice", "minecraft:drown=water", "minecraft:wither=curse", "minecraft:magic=space", "minecraft:sonic_boom=sound"]
#Explicit components for a skill submode: skill_id#mode=form:x,element:y,effect:z,power:n,cost:c (any part may be left out).
skillComponentOverrides = ["tensura:great_sage#0=form:aura,element:light,effect:haste,power:3,cost:light", "tensura:predator#0=form:strike,element:darkness,effect:siphon,power:3,cost:standard"]
#Element given to physical hits.
physicalElement = "aura"
#Element used when nothing else can be inferred.
fallbackElement = "space"
#Damage a hit needs for power tiers 2, 3, 4 and 5.
powerTier2 = 10.0
powerTier3 = 30.0
powerTier4 = 80.0
powerTier5 = 200.0
#Source magicule cost below this is a Light profile.
lightCostBelow = 150.0
#Source magicule cost above this is a Heavy profile.
heavyCostAbove = 5000.0
#Source cooldown (seconds) at or below this, on a non-heavy cost, is a Swift profile.
swiftCooldownBelow = 2
#Skills whose submodes teach the Aura cost profile (sources that pay mostly Aura also teach it).
auraCostSkills = ["tensura:martial_master", "tensura:murderer"]
#Skills whose submodes teach the Blood cost profile.
bloodCostSkills = ["trnightmare:cultist", "trnightmare:witches_envy", "trnightmare:shedding_blood_blessing"]
#Source submodes with every component at 100% needed for Vanity to evolve into Vainglory.
evolutionSources = 15
#Allow Vanity to evolve into Vainglory on its own once the requirements are met.
enableEvolution = true
#Allow Vainglory to evolve into Helel, Lord of Vainglory once that skill exists and its requirements are met.
enableHelelEvolution = false
#Skill id of Helel, Lord of Vainglory.
helelSkillId = "trnightmare:helel"

[vanity]
	#Learner mastery and learning point bonus (normal / mastered).
	learnerBonus = 3.0
	learnerBonusMastered = 5.0
	#Analytical Appraisal level (normal / mastered).
	appraisalLevel = 1
	appraisalLevelMastered = 2
	#Analytical Appraisal range in blocks (normal / mastered).
	appraisalRange = 5
	appraisalRangeMastered = 10
	#Targets with more than this multiple of the user's EP only show base stats (normal / mastered).
	appraisalEpRatio = 2.0
	appraisalEpRatioMastered = 4.0
	#Equipped creation slots (normal / mastered).
	equipSlots = 2
	equipSlotsMastered = 3
	#Saved Ego templates.
	templates = 2
	#Highest power tier a creation may use (normal / mastered).
	powerCap = 3
	powerCapMastered = 4
	#Data (percent) gained per component from one hit (normal / mastered).
	hitData = 8.0
	hitDataMastered = 12.0
	#Learner also gains Data from spells (magic).
	learnsFromMagic = false
	#Data (percent) copied per component each second of Data Mining (normal / mastered).
	miningRate = 6.0
	miningRateMastered = 8.0
	#Data Mining range in blocks (normal / mastered).
	miningRange = 6.0
	miningRangeMastered = 6.0
	#Data Mining needs the skill mastered.
	miningRequiresMastery = true
	#The Ego is pushed back when the target's EP exceeds this multiple of the user's.
	pushbackEpRatio = 3.0
	#Multiplier on the power of creations.
	powerScale = 1.0
	#Multiplier on misfire and backfire chances.
	misfireScale = 1.0

