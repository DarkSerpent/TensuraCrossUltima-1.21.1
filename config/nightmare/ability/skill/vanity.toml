	#Output dial: power multiplier at or above 120% and at or above 175% output (below 120% power follows the output percent).
	outputPowerTier2 = 2.0
	outputPowerTier3 = 3.0
	#Output dial: above 100%, cost is multiplied by (output / 100) raised to this exponent; below 100% it falls in step with the output.
	outputCostExponent = 2.5
