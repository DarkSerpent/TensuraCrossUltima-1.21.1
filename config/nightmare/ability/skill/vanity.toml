[signatures]
	#Multiplier on the magicule cost of signature creations, on top of everything else.
	costMultiplier = 2.5
	#Instability added to every signature creation.
	instabilityBonus = 15
	#Multiplier on the power of signature creations.
	powerScale = 1.5
	#Ticks held per charge level gained.
	chargeTicksPerLevel = 20
	#Extra charge levels Vainglory may hold (the base cap is the creation's power tier).
	vaingloryChargeBonus = 2
	#Highest charge level any signature reaches.
	maxChargeLevels = 8
	#Share of the full power dealt at charge level 1; it rises evenly to the full power at the cap.
	chargePowerFloor = 0.35
	#Share of the cast cost drained for every charge level gained while held.
	chargeDrainRatio = 0.15
	#Ticks a fully charged signature may be held before it fires on its own.
	overholdTicks = 100
