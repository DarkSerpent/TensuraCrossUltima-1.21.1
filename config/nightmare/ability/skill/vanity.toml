	#Output dial: backfire chance multiplier at or above 120%, 175% and 200% output.
	outputRiskTier2 = 2.0
	outputRiskTier3 = 3.0
	outputRiskTier4 = 5.0

[designer]
	#Free tuning steps a creation's form design gets: base + this many per power tier.
	budgetBase = 2
	budgetPerPower = 1
	#Extra free tuning steps while holding Vainglory.
	vaingloryBudget = 2
	#Instability added for every tuning step spent past the free budget.
	overBudgetInstability = 6
	#Designs spending more than this multiple of the free budget are rejected.
	hardCapMultiplier = 2.5
	#Designer parameters: id=min,max,costPerStep,instabilityPerStep,safeSteps[,required form components separated by |]. Steps past safeSteps add instability; positive cost steps spend budget.
	parameters = ["size=-2,3,0.10,4,2", "speed=-3,4,0.05,5,2", "gravity=0,4,-0.03,3,3", "homing=0,4,0.10,6,2,strike", "range=-2,3,0.06,4,2", "duration=-2,3,0.08,4,2", "pierce=0,5,0.08,5,2,beam", "bounce=0,4,0.06,4,2,projectile", "volley=0,6,0.15,6,2,projectile", "spread=0,6,0.00,0,6", "split=0,5,0.10,6,2,burst", "blast=0,4,0.12,5,2,burst", "linger=0,3,0.15,6,1,field", "glow=-3,4,0.00,0,4", "count=-2,5,0.08,4,3", "charges=0,5,0.10,5,2", "output=-5,10,0.00,0,15"]

