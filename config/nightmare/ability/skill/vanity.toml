	gravityRadiusScale = 0.5
	gravityRangeScale = 0.75
	gravitySpeedScale = 1.0
	#Death Streak: share of the source magic's ray reach and ray width.
	streakRangeScale = 0.6
	streakWidthScale = 1.0

