#Place real temporary fire blocks on terrain. When false, flames are visual only (damage still applies).
terrainFire = true
#Require the mobGriefing game rule for temporary fire blocks.
respectMobGriefing = false
#Fuel tiers: item=multiplier[,tier name[,#RRGGBB flame tint]]. Use #namespace:tag for item tags. Missing items are skipped.
