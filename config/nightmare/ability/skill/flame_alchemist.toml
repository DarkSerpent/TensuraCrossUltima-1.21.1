#Magicules needed to acquire Flame Alchemist.
magiculeAcquirement = 60000.0
#Ticks the skill key must be held before the radial menu opens. A shorter press snaps the armed method.
radialHoldTicks = 5
#Wind-up ticks between raising the hand and the snap, before the Gate of Truth opens.
windupTicks = 10
#Cooldown multiplier once the Gate of Truth is open (0.75 = 25% shorter).
